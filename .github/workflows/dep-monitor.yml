name: Dependency Monitor

on:
  schedule:
    # Every Wednesday at 11:07 UTC
    - cron: '7 11 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report only, no commit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dep-audit:
    name: Dependency audit (includes pin check)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audit tooling
        run: pip install pip-audit 2>/dev/null || true

      - name: Run dependency audit
        run: python .github/scripts/dep_audit.py

      - name: Pin checker — flag unpinned deps
        run: |
          python - <<'EOF'
          from pathlib import Path

          req = Path("requirements.txt")
          if not req.exists():
              exit(0)
          unpinned = []
          for line in req.read_text().splitlines():
              line = line.strip()
              if line and not line.startswith("#"):
                  if "==" not in line:
                      unpinned.append(line)
          if unpinned:
              print("::warning::Unpinned dependencies detected: " + ", ".join(unpinned))
              print("Consider pinning to ensure reproducible builds:")
              for p in unpinned:
                  print(f"  {p}")
          else:
              print("::notice::All dependencies are pinned.")
          EOF

      - name: Check for changes
        id: check
        run: |
          git add .github/reports/deps/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python .github/scripts/commit_validator.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit report
        if: steps.check.outputs.changed == 'true' && !inputs.dry_run
        run: |
          git config user.name "felipebridge"
          git config user.email "felibridge49@gmail.com"
          git commit -m "chore: update dependency report [skip ci]"
          git push
